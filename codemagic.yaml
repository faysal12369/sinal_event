workflows:
  ios-release:
    name: Sinal_Event
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get dependencies
        script: flutter pub get

      - name: Install pods
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS (no signing)
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
